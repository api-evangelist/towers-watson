description: >-
  Towers Watson was a global professional services company that provided risk management, actuarial, human capital, and
  investment consulting services before merging with Willis Group to form Willis Towers Watson (now WTW) in 2016. WTW
  provides data-driven, insight-led solutions in risk, broking, HR consulting, and benefits administration across 140+
  countries. WTW's software products include the HR Portal for employee benefits communication, benefits administration
  systems, compensation management tools, and actuarial modeling platforms.
